<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <article class="card">
            <img class="blog-preview-img" src="assets/images/illustration-article.svg" alt="Abstract illustration of opening and closing tags and curly braces">
            <div class="content-wrapper flow">
                <div class="category-tag">Learning</div>
                <p class="date">Published
                    <time datetime="2023-12-21">21 Dec 2023</time>
                </p>
                <h2 class="blog-title"><a href="#">HTML & CSS foundations</a></h2>
                <p class="blog-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
            </div>
            <div class="author-wrapper">
                <img src="assets/images/image-avatar.webp" alt="Image of the authors head">
                <div class="blog-author">Greg Hooper</div>
            </div>
        </article>
    </main>
</body>
</html>
